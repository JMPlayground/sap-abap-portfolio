<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABAP SQL 30제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study tool, calm and exact
   IDEA an SAP GUI workbench sheet: data browser tables (SE16N) and the ABAP editor side by side
   PICTURE the problem card itself: source tables and expected result on the left, ABAP editor on the right
   COLOUR white ground, SAP blue for actions and keys, SAP editor colours for code, red / green / gold for feedback
   TYPE Schibsted Grotesk for text, JetBrains Mono for ABAP and field names
   LAYOUT laptop: two columns (data | editor, editor sticky); under 900px one column: question, tables, editor */
:root{color-scheme:light;--bg:#ffffff;--sheet:#ffffff;--ink:#1d2d3e;--mute:#556b82;--rule:#d9dee3;--head:#f5f6f7;--brick:#0a6ed1;--brickbg:#ebf5fe;--red:#bb0000;--redbg:#ffebeb;--teal:#107e3e;--tealbg:#f1fdf6;--amber:#7a5b00;--amberbg:#fff8d6;--code:#ffffff;--gut:#f2f2f2;--kw:#0000ff;--lit:#3b9a12;--cmt:#808080}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Schibsted Grotesk",system-ui,sans-serif;overflow-x:clip}
code,pre,textarea,.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
code{font-size:.9em;background:var(--code);border:1px solid var(--rule);border-radius:4px;padding:0 4px;overflow-wrap:anywhere}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:16px max(4vw,16px) 0;max-width:1320px;margin:0 auto;justify-content:flex-end}
.top h1{font-size:clamp(24px,3vw,32px);line-height:1.05;letter-spacing:-.02em;margin:0;font-weight:800}
.top .sub{color:var(--mute);font-size:14px}
.nav{margin-left:auto;display:flex;align-items:center;gap:8px}
button,select{font:inherit;font-size:15px;min-height:44px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet);color:var(--ink);padding:0 16px;cursor:pointer}
button:hover{border-color:var(--ink)}
button:focus-visible,select:focus-visible,textarea.x:focus-visible{outline:3px solid color-mix(in srgb,var(--brick) 55%,transparent);outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
.primary{background:var(--brick);border-color:var(--brick);color:#fff;font-weight:600}
.primary:hover{border-color:var(--brick);filter:brightness(1.07)}
select{padding:0 10px;font-family:"JetBrains Mono",monospace}
.wrap{max-width:1320px;margin:0 auto;padding:16px max(4vw,16px) 40px}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;box-shadow:0 1px 2px rgba(29,45,62,.06)}
.qhead{padding:22px 24px 18px;border-bottom:1px solid var(--rule)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;color:var(--mute);margin-bottom:8px}
.chip{border:1px solid var(--rule);border-radius:999px;padding:2px 10px;white-space:nowrap}
.chip.lv2{border-color:var(--brick);color:var(--brick);background:var(--brickbg)}
.solved{color:var(--teal);font-weight:600}
.qno{font:800 clamp(30px,4vw,44px)/1 "Schibsted Grotesk",sans-serif;letter-spacing:-.02em;margin-right:6px;color:var(--ink)}
.q{font-size:clamp(18px,2vw,21px);line-height:1.45;margin:0;text-wrap:pretty}
.note{margin-top:10px;font-size:14px;color:var(--mute)}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.data{padding:20px 24px 24px;border-right:1px solid var(--rule)}
.edit{padding:20px 24px 24px}
@media(min-width:901px){.edit-in{position:sticky;top:16px}}
h2{font-size:14px;font-weight:600;color:var(--mute);margin:0 0 8px}
.tb{margin-bottom:20px}
.tb h3{font-size:16px;margin:0 0 6px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tb h3 .mono{font-weight:600}
.tb h3 span:last-child{color:var(--mute);font-weight:400;font-size:14px}
.scroll{overflow-x:auto;border:1px solid var(--rule);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 10px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{background:var(--head);vertical-align:bottom;font-weight:600}
th .fn{font-family:"JetBrains Mono",monospace;font-size:13px;display:flex;gap:4px;align-items:center}
th .fl{display:block;font-weight:400;font-size:12px;color:var(--mute)}
th.k .fn{color:var(--brick)}
td{font-family:"JetBrains Mono",monospace;font-size:13px}
td.n,th.n{text-align:right}th.n .fn{justify-content:flex-end}
.keyico{width:13px;height:13px;flex:none}
.legend{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center;margin:-8px 0 18px}
.exp h3{color:var(--ink)}
pre.given{margin:0 0 14px;padding:12px 14px;background:#fff;border:1px solid var(--rule);border-left:4px solid var(--gut);border-radius:4px;font-size:13px;line-height:1.5;overflow-x:auto;color:#000}
.kw{color:var(--kw)}.lit{color:var(--lit)}.cmt{color:var(--cmt);font-style:italic}
label.lb{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
.editor{display:grid;grid-template-columns:auto minmax(0,1fr);border:1px solid #8396a8;border-radius:4px;background:#fff;height:220px;resize:vertical;overflow:hidden}
.editor:focus-within{border-color:var(--brick);box-shadow:0 0 0 2px var(--brickbg)}
.gutter{background:var(--gut);color:#8c8c8c;border-right:1px solid var(--rule);padding:10px 8px 10px 10px;text-align:right;font:15px/1.6 "JetBrains Mono",ui-monospace,monospace;overflow:hidden;user-select:none;white-space:pre}
.area{position:relative;overflow:hidden}
.area pre,.area textarea{position:absolute;inset:0;margin:0;padding:10px 12px;font:15px/1.6 "JetBrains Mono",ui-monospace,monospace;white-space:pre;overflow-wrap:normal;tab-size:2;border:0}
.area pre{color:#000;pointer-events:none;overflow:hidden}
.area textarea{width:100%;height:100%;resize:none;background:transparent;color:transparent;caret-color:#000;overflow:auto;outline:none}
.area textarea::placeholder{color:#9aa5b1}
.area textarea::selection{background:rgba(10,110,209,.25)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.btns .kbd{font-size:13px;color:var(--mute);margin-left:auto}
.fb{margin-top:14px;border-radius:8px;padding:14px 16px;border:1px solid transparent;display:none}
.fb.show{display:block}
.fb h4{margin:0 0 6px;font-size:17px}
.fb ul{margin:0;padding-left:20px}.fb li{margin:4px 0}
.fb.ok{background:var(--tealbg);border-color:var(--teal)}.fb.ok h4{color:var(--teal)}
.fb.err{background:var(--redbg);border-color:var(--red)}.fb.err h4{color:var(--red)}
.fb.wr{background:var(--amberbg);border-color:var(--amber)}.fb.wr h4{color:var(--amber)}
.fb .notes{margin-top:8px;font-size:14px;color:var(--mute)}
.hint{margin-top:12px;font-size:15px;border-left:3px solid var(--brick);padding:6px 0 6px 12px;display:none}
.hint.show{display:block}
.hint b.t{display:block;font-size:13px;color:var(--mute);font-weight:600}
.ans pre{margin:6px 0 0;padding:10px 12px;background:#fff;border:1px solid var(--rule);border-left:4px solid var(--gut);border-radius:4px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;color:#000}
.bottom{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.foot{font-size:13px;color:var(--mute);margin-top:12px}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}.data{border-right:0;border-bottom:1px solid var(--rule)}}
@media(max-width:600px){.qhead,.data,.edit{padding-left:16px;padding-right:16px}.nav{margin-left:0;width:100%}.nav select{flex:1}th,td{padding:6px 7px}.btns .kbd{display:none}}
@media(prefers-reduced-motion:no-preference){.fb.show{animation:pop .22s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.4}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header class="top">
  <div class="nav">
    <button id="prev" aria-label="이전 문제">이전</button>
    <select id="jump" aria-label="문제 선택"></select>
    <button id="next" aria-label="다음 문제">다음</button>
  </div>
</header>
<main class="wrap">
  <article class="sheet" id="card"></article>
  <div class="bottom">
    <button id="prev2">← 이전 문제</button>
    <button id="next2" class="primary">다음 문제 →</button>
  </div>
</main>
<script>
/* Mini classic ABAP Open SQL engine: tokenize -> parse -> execute -> INTO mapping -> grade */
(function (G) {
  class SqlErr extends Error { constructor(msg) { super(msg); this.sqlErr = true; } }
  const err = (m) => { throw new SqlErr(m); };
  const U = (s) => String(s).toUpperCase();
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
  const AGG = ['COUNT', 'SUM', 'AVG', 'MAX', 'MIN'];
  const CLAUSE = ['INTO', 'FROM', 'WHERE', 'GROUP', 'HAVING', 'ORDER', 'UP', 'APPENDING'];

  /* ---------- tokenizer ---------- */
  function stripStrings(src) { return src.replace(/'(?:[^']|'')*'/g, "''"); }
  function tokenize(src) {
    const t = []; let i = 0;
    while (i < src.length) {
      const c = src[i];
      if (/\s/.test(c)) { i++; continue; }
      if (c === '"') { while (i < src.length && src[i] !== '\n') i++; continue; }
      if (c === "'") {
        let j = i + 1, s = '';
        for (;;) {
          if (j >= src.length) err("작은따옴표(')가 닫히지 않았어요.");
          if (src[j] === "'") { if (src[j + 1] === "'") { s += "'"; j += 2; continue; } break; }
          s += src[j]; j++;
        }
        t.push({ t: 'str', v: s, raw: src.slice(i, j + 1) }); i = j + 1; continue;
      }
      if (/[0-9]/.test(c)) {
        const m = /^\d+(?:\.\d+)?/.exec(src.slice(i));
        t.push({ t: 'num', v: parseFloat(m[0]), raw: m[0] }); i += m[0].length; continue;
      }
      if (/[A-Za-z_]/.test(c)) {
        const m = /^[A-Za-z_][A-Za-z0-9_\-\/]*/.exec(src.slice(i));
        let raw = m[0];
        while (raw.endsWith('-')) raw = raw.slice(0, -1);
        t.push({ t: 'id', v: U(raw), raw }); i += raw.length; continue;
      }
      const two = src.slice(i, i + 2);
      if (['<=', '>=', '<>', '=<', '=>', '><'].includes(two)) {
        const map = { '=<': '<=', '=>': '>=', '><': '<>' };
        t.push({ t: 'op', v: map[two] || two, raw: two }); i += 2; continue;
      }
      if ('=<>(),*~.-'.includes(c)) { t.push({ t: c === '.' ? 'dot' : 'op', v: c, raw: c }); i++; continue; }
      err(`알 수 없는 문자 '${esc(c)}' 가 있어요.`);
    }
    return t;
  }

  /* ---------- parser ---------- */
  function parse(src) {
    if (!src.trim()) err('SQL을 입력해 주세요.');
    const noStr = stripStrings(src);
    if (/@/.test(noStr)) err('클래식 문법 문제예요. <code>@</code> 없이 써 주세요. (예: <code>INTO TABLE gt_flight</code>)');
    if (/\bDATA\s*\(/i.test(noStr)) err('클래식 문법에서는 인라인 선언 <code>DATA( )</code> 를 쓰지 않아요. 문제에 선언된 변수를 INTO 뒤에 쓰세요.');
    if (/"[^"\n]*"/.test(src)) err('ABAP에서 문자 값은 작은따옴표 <code>\'LH\'</code> 로 감싸요. 큰따옴표 <code>"</code> 는 주석 기호예요.');
    const T = tokenize(src);
    let p = 0;
    const peek = (k = 0) => T[p + k];
    const isKw = (w, k = 0) => { const x = T[p + k]; return x && x.t === 'id' && x.v === w; };
    const isOp = (o, k = 0) => { const x = T[p + k]; return x && x.t === 'op' && x.v === o; };
    const near = () => (peek() ? `<code>${esc(peek().raw)}</code> 근처` : '문장 끝');
    const expectKw = (w, why) => { if (!isKw(w)) err(`${near()}에서 <code>${w}</code> 가 필요해요.${why ? ' ' + why : ''}`); p++; };
    const expectOp = (o, why) => { if (!isOp(o)) err(`${near()}에서 <code>${esc(o)}</code> 가 필요해요.${why ? ' ' + why : ''}`); p++; };
    const ident = (what) => {
      const x = peek();
      if (!x || x.t !== 'id') err(`${near()}에서 ${what} 이름이 와야 해요.`);
      p++; return x;
    };
    const ast = { single: false, distinct: false, star: false, items: [], into: null, from: null, where: null, groupBy: null, having: null, orderBy: null, upTo: null, hasDot: false, commaSel: false, aggNoSpace: false };

    function colref() {
      const a = ident('필드');
      if (isOp('~')) { p++; const b = ident('필드'); return { q: a.v, name: b.v, raw: a.raw + '~' + b.raw }; }
      return { q: null, name: a.v, raw: a.raw };
    }
    function aggr() {
      const fn = peek().v; p++;
      if (!isOp('(')) err(`<code>${fn}</code> 뒤에는 괄호가 필요해요. 예: <code>${fn}( 필드 )</code>`);
      p++;
      let distinct = false, arg;
      if (isKw('DISTINCT')) { distinct = true; p++; }
      if (isOp('*')) { if (fn !== 'COUNT') err(`<code>${fn}( * )</code> 는 안 돼요. <code>*</code> 는 COUNT에만 써요.`); p++; arg = '*'; }
      else arg = colref();
      expectOp(')', '집계함수 괄호를 닫아 주세요.');
      return { k: 'agg', fn, distinct, arg };
    }
    function operand() {
      const x = peek();
      if (!x) err('조건이 끝나지 않았어요. 비교할 값이 필요해요.');
      if (x.t === 'str') { p++; return { k: 'lit', v: x.v, str: true }; }
      if (x.t === 'num') { p++; return { k: 'lit', v: x.v, str: false }; }
      if (x.t === 'op' && x.v === '-' && peek(1) && peek(1).t === 'num') { p += 2; return { k: 'lit', v: -peek(-1).v, str: false }; }
      if (x.t === 'id' && AGG.includes(x.v) && isOp('(', 1)) return aggr();
      if (x.t === 'id') return { k: 'col', ref: colref() };
      err(`${near()}: 여기에는 필드나 값이 와야 해요.`);
    }
    const CMP = { '=': '=', EQ: '=', '<>': '<>', NE: '<>', '<': '<', LT: '<', '>': '>', GT: '>', '<=': '<=', LE: '<=', '>=': '>=', GE: '>=' };
    function predicate() {
      const l = operand();
      let not = false;
      if (isKw('NOT') && (isKw('BETWEEN', 1) || isKw('IN', 1) || isKw('LIKE', 1))) { not = true; p++; }
      const x = peek();
      if (!x) err('조건이 끝나지 않았어요. 비교 연산자(=, >, ...)가 필요해요.');
      if (isKw('BETWEEN')) { p++; const lo = operand(); expectKw('AND', 'BETWEEN a AND b 형태예요.'); const hi = operand(); return { op: 'between', not, e: l, lo, hi }; }
      if (isKw('IN')) {
        p++; expectOp('(', 'IN 뒤에는 ( 값, 값 ) 목록이 와요.');
        const list = [operand()];
        while (isOp(',') || (peek() && (peek().t === 'str' || peek().t === 'num'))) { if (isOp(',')) p++; list.push(operand()); }
        expectOp(')', 'IN 목록 괄호를 닫아 주세요.');
        return { op: 'in', not, e: l, list };
      }
      if (isKw('LIKE')) { p++; const pat = operand(); if (pat.k !== 'lit' || !pat.str) err("LIKE 뒤에는 <code>'%값%'</code> 같은 문자 패턴이 와요."); return { op: 'like', not, e: l, pat: pat.v }; }
      if (isKw('IS')) {
        p++; let n = false; if (isKw('NOT')) { n = true; p++; }
        if (isKw('NULL')) { p++; return { op: 'null', not: n, e: l }; }
        if (isKw('INITIAL')) { p++; return { op: 'initial', not: n, e: l }; }
        err('IS 뒤에는 NULL 또는 INITIAL 이 와요.');
      }
      const key = x.t === 'op' ? x.v : x.t === 'id' ? x.v : null;
      if (!CMP[key]) {
        if (l.k === 'col' && x.t !== 'op') err(`<code>${esc(l.ref.raw)}</code> 뒤에 비교 연산자(=, >, &lt; ...)가 필요해요. 문자 값이면 작은따옴표로 감싸야 해요.`);
        err(`${near()}에서 비교 연산자(=, >, &lt; ...)가 필요해요.`);
      }
      p++;
      return { op: 'cmp', cmp: CMP[key], l, r: operand() };
    }
    function primary() {
      if (isOp('(')) { p++; const c = cond(); expectOp(')', '조건 괄호를 닫아 주세요.'); return c; }
      return predicate();
    }
    function notE() { if (isKw('NOT')) { p++; return { op: 'not', e: notE() }; } return primary(); }
    function andE() { let l = notE(); while (isKw('AND')) { p++; l = { op: 'and', l, r: notE() }; } return l; }
    function cond() { let l = andE(); while (isKw('OR')) { p++; l = { op: 'or', l, r: andE() }; } return l; }
    function tableRef() {
      const x = peek();
      if (!x || x.t !== 'id' || CLAUSE.includes(x.v) && x.v !== 'UP') err(`${near()}에서 테이블 이름이 와야 해요.`);
      p++;
      const tr = { name: x.v, raw: x.raw, alias: null };
      if (isKw('AS')) { p++; tr.alias = ident('별명').v; }
      return tr;
    }

    expectKw('SELECT', 'SQL은 <code>SELECT</code> 로 시작해요.');
    if (isKw('SINGLE')) { ast.single = true; p++; }
    if (isKw('DISTINCT')) { ast.distinct = true; p++; }
    if (isOp('*')) { ast.star = true; p++; }
    else {
      for (;;) {
        const x = peek();
        if (!x || x.t === 'dot' || (x.t === 'id' && CLAUSE.includes(x.v))) break;
        if (isOp(',')) { ast.commaSel = true; p++; continue; }
        let it;
        if (x.t === 'id' && AGG.includes(x.v) && isOp('(', 1)) it = aggr();
        else if (x.t === 'id') it = { k: 'col', ref: colref() };
        else err(`${near()}: SELECT 뒤에는 필드 이름이 와야 해요.`);
        if (isKw('AS')) { p++; it.alias = ident('별명').v; }
        ast.items.push(it);
      }
      if (!ast.items.length) err('SELECT 뒤에 가져올 필드(또는 <code>*</code>)를 적어 주세요.');
    }
    if (ast.commaSel) err('클래식 문법에서는 SELECT 필드를 콤마(,) 없이 <b>띄어쓰기</b>로 구분해요. 예: <code>SELECT carrid connid</code>');
    if (/\b(SUM|AVG|MAX|MIN|COUNT)\((?!\s|\*\))/i.test(noStr) || /\b(SUM|AVG|MAX|MIN|COUNT)\(\s*\S+?[^\s(]\)/i.test(noStr)) ast.aggNoSpace = true;

    const seen = {};
    const once = (k) => { if (seen[k]) err(`<code>${k}</code> 절이 두 번 나왔어요.`); seen[k] = 1; };
    for (;;) {
      const x = peek();
      if (!x) break;
      if (x.t === 'dot') { ast.hasDot = true; p++; if (peek()) err('SELECT문 하나만 입력해 주세요. 마침표(.) 뒤에 다른 내용이 있어요.'); break; }
      if (isKw('INTO')) {
        once('INTO'); p++;
        const into = { corr: false, table: false, target: null };
        if (isKw('CORRESPONDING')) { p++; expectKw('FIELDS', '<code>CORRESPONDING FIELDS OF</code> 형태예요.'); expectKw('OF', '<code>CORRESPONDING FIELDS OF</code> 형태예요.'); into.corr = true; }
        if (isKw('TABLE')) { p++; into.table = true; }
        if (isOp('(')) err('이 연습에서는 <code>INTO ( 변수, 변수 )</code> 대신 문제에 선언된 변수 하나에 담아요.');
        const tg = ident('INTO 대상 변수');
        if (tg.v === 'TABLE' || tg.v === 'CORRESPONDING') err('INTO 순서는 <code>INTO CORRESPONDING FIELDS OF TABLE gt_xxx</code> 예요.');
        into.target = tg.v; into.raw = tg.raw;
        ast.into = into; continue;
      }
      if (isKw('APPENDING')) err('이 연습에서는 <code>INTO TABLE</code> 을 사용해요.');
      if (isKw('FROM')) {
        once('FROM'); p++;
        const from = { base: tableRef(), joins: [] };
        for (;;) {
          let type = null;
          if (isKw('INNER') && isKw('JOIN', 1)) { p += 2; type = 'INNER'; }

          from.joins.push({ type, table: tr, on: cond() });
        }

      }
      if (isKw('WHERE')) { once('WHERE'); p++; ast.where = cond(); continue; }
      if (isKw('GROUP')) {
        once('GROUP'); p++; expectKw('BY', '<code>GROUP BY</code> 로 써요.');
        ast.groupBy = [];
        for (;;) { if (isOp(',')) { p++; continue; } const y = peek(); if (!y || y.t !== 'id' || CLAUSE.includes(y.v)) break; ast.groupBy.push(colref()); }
        if (!ast.groupBy.length) err('GROUP BY 뒤에 묶을 기준 필드를 적어 주세요.');

      }
      if (isKw('HAVING')) { once('HAVING'); p++; ast.having = cond(); continue; }
      if (isKw('ORDER')) {

        for (;;) {
          if (isOp(',')) { p++; continue; }
          const y = peek(); if (!y || y.t !== 'id' || CLAUSE.includes(y.v)) break;

      }

        once('UP'); p++; expectKw('TO', '<code>UP TO n ROWS</code> 형태예요.');
        const n = peek(); if (!n || n.t !== 'num') err('UP TO 뒤에는 숫자가 와요.'); p++;

      }
      if (isKw('ENDSELECT')) err('이 연습에서는 <code>SELECT ... ENDSELECT</code> 루프 대신 <code>INTO TABLE</code> 또는 <code>SELECT SINGLE</code> 을 써요.');
      if (x.t === 'op' && x.v === ',') err(`${near()}: 콤마(,)가 들어갈 자리가 아니에요.`);
      if (x.t === 'op' && x.v === '-') err('SQL 안에서 테이블과 필드는 <code>-</code> 가 아니라 <code>~</code> 로 연결해요. 예: <code>a~carrid</code>');

  }

  /* ---------- execution ---------- */
  const isNum = (v) => typeof v === 'number' || (typeof v === 'string' && v.trim() !== '' && !isNaN(Number(v)));

  }
  function allValues(tables) { const s = []; tables.forEach((t) => t.rows.forEach((r) => Object.values(r).forEach((v) => s.push(v)))); return s; }

  function run(ast, tables) {
    const byName = {}; tables.forEach((t) => (byName[t.name] = t));
    const sources = [];
    const addSrc = (tr) => {
      if (/-/.test(tr.name)) err(`테이블 이름 <code>${esc(tr.raw)}</code> 를 확인해 주세요.`);
      const tbl = byName[tr.name];
      if (!tbl) err(`<code>${esc(tr.raw)}</code> 테이블은 이 문제에 없어요. 쓸 수 있는 테이블: ${tables.map((t) => '<code>' + t.name.toLowerCase() + '</code>').join(', ')}`);
      const s = { name: tr.name, alias: tr.alias || tr.name, tbl };
      if (sources.some((o) => o.alias === s.alias)) err(`<code>${esc(tr.raw)}</code> 테이블을 두 번 쓰려면 서로 다른 별명(AS)이 필요해요.`);

    const hasJoin = sources.length > 1;

    const resolved = new Map();
    function resolve(ref) {

      if (!ref.q && allValues(tables).some((v) => String(v).toUpperCase() === ref.name)) err(`<code>${esc(ref.raw)}</code> 는 필드가 아니라 값처럼 보여요. 문자 값은 작은따옴표로 감싸요: <code>'${esc(ref.raw)}'</code>`);
      if (/-/.test(ref.name) || (ref.q && /-/.test(ref.q))) err(`SQL 안에서는 <code>${esc(ref.raw)}</code> 처럼 <code>-</code> 를 쓰지 않아요. 테이블(별명)과 필드는 <code>~</code> 로 연결해요. 예: <code>${esc(ref.raw.replace('-', '~'))}</code>`);

      if (ref.q) {

        if (c.length > 1) err(`<code>${esc(ref.raw)}</code> 필드가 ${c.map((s) => s.name).join(', ')} 양쪽에 있어요. 어느 테이블 것인지 <code>a~${esc(ref.raw.toLowerCase())}</code> 처럼 앞에 붙여 주세요.`);

      const names = srcs.map((s) => `<code>${s.name.toLowerCase()}</code>: ${s.tbl.cols.map((c) => c.n.toLowerCase()).join(' ')}`).join(' / ');

    const hasAgg = ast.items.some((i) => i.k === 'agg') || !!ast.having;

        if (!ast.groupBy) groups.set('all', ctxs);
        else ctxs.forEach((c) => { const k = JSON.stringify(gb.map((g) => (c[g.src.alias] ? c[g.src.alias][g.col] : null))); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(c); });

  /* ---------- INTO mapping ---------- */
  function intoTarget(ast, res, target) {

      comps.forEach((c, i) => { if (i >= res.cols.length) missing.push(c.n); });

  /* ---------- compare & grade ---------- */
  const norm = (v, c) => (c.num ? Math.round(Number(v) * 100) / 100 : String(v));

      for (const k of ks) { const d = cmpVals(rows[r - 1][k.i], rows[r][k.i]); if (d === 0) continue; if ((k.desc ? -d : d) > 0) return false; break; }
    }

  }
  function tableNames(ast) { return [ast.from.base.name, ...ast.from.joins.map((j) => j.table.name)]; }
  function strLits(ast) { const s = []; const w = (c) => { if (!c) return; if (c.op === 'and' || c.op === 'or') { w(c.l); w(c.r); } else if (c.op === 'not') w(c.e); else [c.l, c.r, c.e, c.lo, c.hi, ...(c.list || [])].forEach((o) => o && o.k === 'lit' && o.str && s.push(o.v)); }; w(ast.where); w(ast.having); return s; }

  function diagnose(u, s, ur, er, prob, tables) {
    const H = [], comps = prob.target.comps;
    const ut = tableNames(u), st = tableNames(s);
    const miss = st.filter((t) => !ut.includes(t)), extra = ut.filter((t) => !st.includes(t));
    if (miss.length) H.push(`이 문제는 <code>${miss.map((t) => t.toLowerCase()).join(', ')}</code> 테이블도 필요해요. JOIN으로 연결해 보세요.`);

const fmt = (v, c) => (c && c.num && c.dec ? Number(v).toFixed(c.dec) : v === null || v === undefined ? '' : String(v));
const KWS = new Set('SELECT SINGLE DISTINCT FROM INTO TABLE CORRESPONDING FIELDS OF WHERE AND OR NOT IN BETWEEN LIKE IS NULL INITIAL GROUP BY HAVING ORDER ASCENDING DESCENDING ASC DESC UP TO ROWS INNER LEFT OUTER JOIN ON AS COUNT SUM AVG MAX MIN TYPES DATA BEGIN END TYPE DECIMALS EQ NE LT GT LE GE PRIMARY KEY ENDSELECT APPENDING'.split(' '));
const hl = (code) => String(code).replace(/('(?:[^'\n]|'')*'?)|("[^\n]*)|(^\*[^\n]*)|([A-Za-z_][A-Za-z0-9_\-\/]*)|([\s\S])/gm, (m, s, c1, c2, w) => s ? `<span class="lit">${h(s)}</span>` : (c1 || c2) ? `<span class="cmt">${h(m)}</span>` : w ? (KWS.has(w.toUpperCase()) ? `<span class="kw">${h(w)}</span>` : h(w)) : h(m));

function tableHtml(cols, rows) {
  const th = cols.map((c) => `<th class="${c.key ? 'k ' : ''}${c.num ? 'n' : ''}"><span class="fn">${c.key ? KEY : ''}${h(c.n)}</span>${c.l ? `<span class="fl">${h(c.l)}</span>` : ''}</th>`).join('');
  const tr = rows.map((r) => `<tr>${cols.map((c, i) => `<td class="${c.num ? 'n' : ''}">${h(fmt(Array.isArray(r) ? r[i] : r[c.n], c))}</td>`).join('')}</tr>`).join('');
  return `<div class="scroll"><table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table></div>`;
}
function compsMeta(p, tables) {
  return p.target.comps.map((c) => {
    let src = null;
    for (const t of tables) { const f = t.cols.find((x) => x.n === c.n); if (f) { src = f; break; } }
    const base = src ? { l: src.l, num: src.num, dec: src.dec } : {};
    const extra = { CNT: '개수', TOTAL_OCC: '예약 좌석 합계', MAX_SCORE: '최고 점수', MIN_SCORE: '최저 점수', AVG_SCORE: '평균 점수', TOTAL_QTY: '총 수량' }[c.n];
    return { n: c.n, l: extra || base.l || '', num: c.num, dec: c.dec ?? base.dec };
  });
}
function render() {
  const p = P[st.cur];
  const ex = E.expected(p, M);
  const comps = compsMeta(p, ex.tables);
  const tablesHtml = ex.tables.map((t) => `<section class="tb"><h3><span class="mono">${t.name}</span><span>${h(t.label)}</span></h3>${tableHtml(t.cols, t.rows)}</section>`).join('');
  const expLabel = p.target.kind === 'table' ? `인터널 테이블 ${p.target.name}` : p.target.kind === 'struct' ? `구조 ${p.target.name} (한 줄)` : `변수 ${p.target.name} (값 하나)`;
  document.getElementById('card').innerHTML = `
    <div class="qhead">
      <div class="meta"><span class="qno">${String(p.no).padStart(2, '0')}</span><span class="chip">${CAT[p.cat]}</span><span class="chip ${p.lv === '응용' ? 'lv2' : ''}">${p.lv}</span>${st.solved[p.no] ? '<span class="solved">✓ 푼 문제</span>' : ''}</div>
      <p class="q">${p.q}</p>
      ${p.note ? `<p class="note">${p.note}</p>` : ''}
    </div>
    <div class="grid">
      <div class="data">
        <h2>사용할 테이블</h2>
        ${tablesHtml}
        <section class="tb exp"><h3><span>기대 결과</span><span class="mono">${h(expLabel)}</span></h3>${tableHtml(comps, ex.rows)}</section>
      </div>
      <div class="edit"><div class="edit-in">
        <h2>주어진 선언</h2>
        <pre class="given">${hl(p.given)}</pre>
        <label class="lb" for="sql">SELECT문을 작성하세요</label>
        <div class="editor"><div class="gutter" id="gut">1</div><div class="area"><pre id="hlpre" aria-hidden="true"></pre><textarea id="sql" spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off" placeholder="SELECT ...&#10;  FROM ...&#10;  INTO ...&#10;  WHERE ... ."></textarea></div></div>
        <div class="btns">
          <button class="primary" id="run">채점</button>
          <button id="hintb">힌트</button>
          <button id="ansb">정답 보기</button>
          <span class="kbd">Ctrl + Enter 로 채점</span>
        </div>
        <div class="fb" id="fb" role="status" aria-live="polite"></div>
        <div class="hint" id="h1"><b class="t">힌트 1</b>${p.hints[0]}</div>
        <div class="hint" id="h2"><b class="t">힌트 2</b>${p.hints[1]}</div>
        <div class="hint ans" id="ans"><b class="t">정답 예시</b><pre>${hl(p.sol)}</pre></div>
      </div></div>
    </div>`;
  const ta = document.getElementById('sql');
  const pre = document.getElementById('hlpre'), gut = document.getElementById('gut');
  const paint = () => { pre.innerHTML = hl(ta.value) + '\n'; gut.textContent = ta.value.split('\n').map((_, i) => i + 1).join('\n'); sync(); };
  const sync = () => { pre.scrollTop = ta.scrollTop; pre.scrollLeft = ta.scrollLeft; gut.scrollTop = ta.scrollTop; };
  ta.value = st.ans[p.no] || '';
  paint();
  ta.addEventListener('scroll', sync);
  ta.addEventListener('input', () => { st.ans[p.no] = ta.value; save(); paint(); });
  ta.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); check(); } });
  document.getElementById('run').onclick = check;
  let hs = 0;
  document.getElementById('hintb').onclick = () => { hs = Math.min(hs + 1, 2); document.getElementById('h' + hs).classList.add('show'); if (hs === 2) document.getElementById('hintb').disabled = true; };
  document.getElementById('ansb').onclick = () => document.getElementById('ans').classList.toggle('show');
  const sel = document.getElementById('jump'); sel.value = st.cur;
  ['prev', 'prev2'].forEach((id) => (document.getElementById(id).disabled = st.cur === 0));
  ['next', 'next2'].forEach((id) => (document.getElementById(id).disabled = st.cur === P.length - 1));
}
function check() {
  const p = P[st.cur], fb = document.getElementById('fb');
  const sql = document.getElementById('sql').value;
  let g;
  try { g = E.grade(sql, p, M); } catch (e) { g = { status: 'error', msg: '채점 중 문제가 생겼어요. 문장을 다시 확인해 주세요.' }; }
  const notes = g.notes && g.notes.length ? `<div class="notes">참고: ${g.notes.join(' ')}</div>` : '';
  if (g.status === 'ok') {
    fb.className = 'fb show ok'; fb.innerHTML = `<h4>정답이에요!</h4><div>결과 ${g.rows.length}행이 기대 결과와 같아요.</div>${notes}`;
    st.solved[p.no] = true; save(); fillJump();
  } else if (g.status === 'error') {
    fb.className = 'fb show err'; fb.innerHTML = `<h4>오류 · 문법이나 이름을 확인하세요</h4><div>${g.msg}</div>`;
  } else {
    fb.className = 'fb show wr'; fb.innerHTML = `<h4>실행은 됐지만 결과가 달라요</h4><ul>${g.hints.map((x) => `<li>${x}</li>`).join('')}</ul>${notes}`;
  }
}
function fillJump() {
  const sel = document.getElementById('jump');
  sel.innerHTML = P.map((p, i) => `<option value="${i}">${String(p.no).padStart(2, '0')} · ${CAT[p.cat].split(' ')[0]}${st.solved[p.no] ? ' ✓' : ''}</option>`).join('');
  sel.value = st.cur;
}
const go = (i) => { st.cur = Math.max(0, Math.min(P.length - 1, i)); save(); render(); window.scrollTo({ top: 0 }); };
document.getElementById('prev').onclick = document.getElementById('prev2').onclick = () => go(st.cur - 1);
document.getElementById('next').onclick = document.getElementById('next2').onclick = () => go(st.cur + 1);
document.getElementById('jump').onchange = (e) => go(Number(e.target.value));
if (!(st.cur >= 0 && st.cur < P.length)) st.cur = 0;
fillJump(); render();
}
</script>
</body>
</html>
